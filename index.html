<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Arena</title>

<style>

body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#3fd3ff,#003a6f);
color:white;
overflow:hidden;
}

/* TOPBAR */

#topbar{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:15px;
}

.bar{
background:#102544;
padding:10px 15px;
border-radius:12px;
font-weight:bold;
}

/* PLAYER */

#player{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

#player img{
width:180px;
}

/* MENUS */

.side{
position:absolute;
top:120px;
display:flex;
flex-direction:column;
gap:10px;
}

#left{ left:10px }
#right{ right:10px }

.btn{
background:#102544;
padding:12px;
border-radius:10px;
width:100px;
text-align:center;
cursor:pointer;
font-weight:bold;
}

/* PLAY */

#play{
position:absolute;
bottom:40px;
right:30px;
background:#ffd800;
border:none;
padding:20px 50px;
font-size:22px;
font-weight:bold;
border-radius:10px;
}

/* MODE */

#mode{
position:absolute;
bottom:40px;
left:30px;
background:#102544;
padding:20px;
border-radius:10px;
}

/* PAGES */

.page{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#1d2a5a;
display:none;
padding:20px;
}

/* JOYSTICK */

#controls{
position:absolute;
bottom:20px;
width:100%;
display:flex;
justify-content:space-between;
padding:0 40px;
pointer-events:none;
}

.joystick{
width:110px;
height:110px;
background:rgba(0,0,0,0.3);
border-radius:50%;
pointer-events:auto;
position:relative;
}

.stick{
width:50px;
height:50px;
background:white;
border-radius:50%;
position:absolute;
top:30px;
left:30px;
}

/* ADMIN */

#admin{
position:absolute;
top:70px;
right:10px;
background:#111;
padding:15px;
border-radius:10px;
display:none;
}

</style>
</head>

<body>

<!-- TOPBAR -->

<div id="topbar">
<div class="bar">🏆 <span id="trophies">0</span></div>
<div class="bar">💎 <span id="gems">25</span></div>
<div class="bar">🪙 <span id="coins">100</span></div>
</div>

<!-- PLAYER -->

<div id="player">
<img src="https://static.wikia.nocookie.net/brawlstars/images/3/3f/Shelly.png">
<br>
<b>Starter Brawler</b>
<br>
<small>ID: <span id="pid"></span></small>
</div>

<!-- MENUS -->

<div id="left" class="side">
<div class="btn">SHOP</div>
<div class="btn" onclick="openPass()">PASS</div>
</div>

<div id="right" class="side">
<div class="btn" onclick="openProfile()">PROFILE</div>
<div class="btn">CLUB</div>
</div>

<!-- MODE -->

<div id="mode">SHOWDOWN</div>

<!-- PLAY -->

<button id="play">PLAY</button>

<!-- PROFILE -->

<div id="profile" class="page">
<h2>PROFILE</h2>

<img id="pfp" src="https://static.wikia.nocookie.net/brawlstars/images/3/3f/Shelly.png" width="100">

<p>ID: <span id="profileID"></span></p
